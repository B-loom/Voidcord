<!doctype html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'self'; style-src 'self'; img-src 'self'; connect-src 'none'; base-uri 'none'; form-action 'none'">
    <title>Nebula</title>
    <link rel="stylesheet" href="langue.css">
    <script src="langue.js" defer></script>
</head>
<body>
    <main>
        <img class="logo" src="icon.png" alt="">
        <h1>Bienvenue dans Nebula</h1>
        <p class="lead">
            Choisis la langue de l’application.<br>
            <span lang="en">Choose the language of the application.</span>
        </p>
        <div class="choix">
            <button id="fr" type="button" lang="fr">
                <strong>Français</strong>
                <span>Tout en français</span>
            </button>
            <button id="en" type="button" lang="en">
                <strong>English</strong>
                <span>Everything in English</span>
            </button>
        </div>
        <p class="note">
            Ce choix se change plus tard dans les réglages.<br>
            <span lang="en">You can change this later in the settings.</span>
        </p>
    </main>
</body>
</html>
