<!doctype html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'self'; style-src 'self'; img-src 'self'; connect-src 'none'; base-uri 'none'; form-action 'none'">
    <title>Voidcord</title>
    <link rel="stylesheet" href="classic.css">
    <script src="startup.js" defer></script>
</head>
<body>
    <button id="close" class="close" type="button" aria-label="Quitter Voidcord"></button>
    <main>
        <div class="artwork" aria-hidden="true">
            <img src="waiting.gif" alt="">
            <span class="still">◈</span>
        </div>
        <section class="feedback">
            <p id="status" role="status" aria-live="polite" aria-atomic="true">Démarrage…</p>
            <div id="actions" class="actions" hidden>
                <button id="retry" type="button">Réessayer</button>
                <button id="quit" type="button">Quitter</button>
            </div>
        </section>
    </main>
</body>
</html>
