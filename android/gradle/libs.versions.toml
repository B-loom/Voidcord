[versions]
agp = "9.2.1"
kotlin = "2.4.21"

# Le SDK installé ici : android-37.0 et build-tools 36.0.0. AndroidX 1.19 exige 37.
compileSdk = "37"
# Android 8.0. En dessous, la WebView est trop ancienne pour le client Discord.
minSdk = "26"
targetSdk = "37"
# Le JDK livré avec Android Studio ici est un Temurin 21.
javaVersion = "21"

androidxCore = "1.19.1"
appcompat = "1.7.1"
lifecycle = "2.9.4"
coroutines = "1.11.0"
okhttp = "4.12.0"
webkit = "1.14.0"

[libraries]
androidx-appcompat = { module = "androidx.appcompat:appcompat", version.ref = "appcompat" }
androidx-core-ktx = { module = "androidx.core:core-ktx", version.ref = "androidxCore" }
androidx-lifecycle-runtime-ktx = { module = "androidx.lifecycle:lifecycle-runtime-ktx", version.ref = "lifecycle" }
androidx-webkit = { module = "androidx.webkit:webkit", version.ref = "webkit" }
kotlinx-coroutines-android = { module = "org.jetbrains.kotlinx:kotlinx-coroutines-android", version.ref = "coroutines" }
okhttp = { module = "com.squareup.okhttp3:okhttp", version.ref = "okhttp" }

[plugins]
android-application = { id = "com.android.application", version.ref = "agp" }
